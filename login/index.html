<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Ambassador Login · Circuit</title>
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="../assets/circuit-mark.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --blue: #155eef; --blue-deep: #053fbd; --blue-bright: #2b76ff;
      --ink: #06080d; --text: #1b2230; --muted: #667085; --soft: #f6f8fc;
      --line: #e1e6ef; --green: #0e7a57; --red: #bd3d36; --white: #fff;
      --shadow: 0 24px 80px rgba(16,29,56,0.12); --soft-shadow: 0 18px 50px rgba(18,35,72,0.08);
      --serif: Georgia, "Times New Roman", serif;
      --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0; min-height: 100dvh; color: var(--text); font-family: var(--sans);
      -webkit-font-smoothing: antialiased; letter-spacing: -0.011em;
      display: flex; flex-direction: column;
      background:
        radial-gradient(1100px 620px at 50% -8%, rgba(21,94,239,0.10), transparent 60%),
        radial-gradient(760px 520px at 88% 6%, rgba(123,97,255,0.07), transparent 55%),
        linear-gradient(180deg,#fbfcff,#fff 38%,#fbfcfe);
      overflow-x: hidden;
    }
    body::before { content:""; position:fixed; inset:0; background-image:url("../assets/grain.svg"); background-size:300px; opacity:.5; mix-blend-mode:multiply; pointer-events:none; z-index:0; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; }
    img { display: block; max-width: 100%; }

    .topbar { position: relative; z-index: 1; padding: 28px 24px; }
    .topbar a { display: inline-block; }
    .topbar img { height: 26px; }

    .wrap { position: relative; z-index: 1; flex: 1; display: flex; align-items: center; justify-content: center; padding: 12px 22px 64px; }
    .card { width: 100%; max-width: 410px; }

    @keyframes rise { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
    .reveal { opacity: 0; animation: rise .7s cubic-bezier(.16,1,.3,1) forwards; }
    .d1{animation-delay:.04s}.d2{animation-delay:.12s}.d3{animation-delay:.2s}
    @media (prefers-reduced-motion: reduce){ .reveal{animation:none;opacity:1} }

    .eyebrow { font-size: 11px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--blue-deep); }
    h1 { margin: 10px 0 8px; font-size: clamp(30px, 9vw, 40px); line-height: 1.02; letter-spacing: -0.03em; font-weight: 800; color: var(--ink); }
    h1 em { font-family: var(--serif); font-style: italic; font-weight: 500; color: var(--blue);
      background: linear-gradient(180deg,var(--blue-bright),var(--blue-deep)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .sub { margin: 0 0 28px; font-size: 15px; color: var(--muted); line-height: 1.5; }

    .panel { background: #fff; border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--soft-shadow); padding: 28px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; font-weight: 700; color: #3a4356; margin-bottom: 7px; }
    .field input { width: 100%; height: 52px; padding: 0 16px; border: 1.5px solid var(--line); border-radius: 12px; font-size: 15px; color: var(--ink); background: var(--soft); outline: none; transition: border-color .15s, box-shadow .15s; }
    .field input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(21,94,239,.1); background: #fff; }
    .field input::placeholder { color: #aab0bc; }

    .login-btn { width: 100%; height: 54px; margin-top: 4px; border: 0; border-radius: 13px; background: var(--ink); color: #fff; font-size: 16px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 14px 30px rgba(6,8,13,.18); transition: transform .15s; }
    .login-btn:hover { transform: translateY(-2px); }
    .login-btn:disabled { opacity: .6; cursor: default; transform: none; box-shadow: none; }
    .login-btn svg { width: 18px; height: 18px; }
    .err { color: var(--red); font-size: 13.5px; font-weight: 600; min-height: 16px; margin: 12px 0 0; }

    .foot { margin-top: 22px; text-align: center; font-size: 13px; color: var(--muted); line-height: 1.7; }
    .foot a { color: var(--blue); font-weight: 600; }
    .page-foot { position: relative; z-index: 1; text-align: center; padding: 0 22px 28px; font-size: 12.5px; color: #98a2b3; }
    .page-foot a { color: var(--muted); font-weight: 600; }
  </style>
</head>
<body>
  <header class="topbar reveal d1">
    <a href="/" aria-label="Circuit home"><img src="../assets/circuit-wordmark.png" alt="Circuit" /></a>
  </header>

  <main class="wrap">
    <div class="card">
      <p class="eyebrow reveal d1">Ambassador Portal</p>
      <h1 class="reveal d1">Welcome <em>back</em>.</h1>
      <p class="sub reveal d2">Log in to reach your resources, referral link, and rewards.</p>

      <div class="panel reveal d2">
        <form id="login-form" autocomplete="on">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="you@school.edu" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="Your password" autocomplete="current-password" required />
          </div>
          <button class="login-btn" id="login-btn" type="submit">
            Log in
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
          <p class="err" id="login-err"></p>
        </form>
      </div>

      <p class="foot reveal d3">
        Trouble logging in? <a href="mailto:hello@circuitcampus.com">hello@circuitcampus.com</a><br />
        Not an ambassador yet? <a href="https://tally.so/r/ja5786" target="_blank" rel="noopener">Apply here</a>
      </p>
    </div>
  </main>

  <footer class="page-foot">&copy; Circuit · <a href="/">circuitcampus.com</a></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://jgcxrfncltttmsuuenpy.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpnY3hyZm5jbHR0dG1zdXVlbnB5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzNDk0NDIsImV4cCI6MjA5NTkyNTQ0Mn0.aXvFLpskKjkZ8GBR0fPPzExfWB3TKFejfSiBnJUT_Qs';

    let sb = null;
    try { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch (e) { console.error(e); }

    const $ = (id) => document.getElementById(id);

    // Already logged in? Skip the form.
    if (sb) {
      sb.auth.getSession().then(({ data: { session } }) => {
        if (session) location.href = '/ambassadors';
      }).catch(() => {});
    }

    $('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = $('login-btn'), err = $('login-err');
      err.textContent = '';
      const email = $('email').value.trim(), password = $('password').value;
      if (!email || !password) { err.textContent = 'Enter your email and password.'; return; }
      if (!sb) { err.textContent = 'Could not connect. Refresh and try again.'; return; }
      btn.disabled = true; btn.textContent = 'Logging in…';
      try {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
        location.href = '/ambassadors';
      } catch (e2) {
        const msg = (e2 && e2.message) || '';
        err.textContent = /invalid login credentials/i.test(msg)
          ? "That email or password isn't right."
          : (/email not confirmed/i.test(msg) ? 'Please confirm your email first, then log in.' : 'Something went wrong. Please try again.');
        btn.disabled = false;
        btn.innerHTML = 'Log in <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
      }
    });
  </script>
</body>
</html>
